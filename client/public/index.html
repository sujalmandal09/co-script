  <!-- Error Suppression for ResizeObserver Loop -->
  <script>
    const _originalConsoleError = console.error;
    console.error = function (...args) {
      if (/ResizeObserver loop/.test(args[0]) || /ResizeObserver loop completed with undelivered notifications/.test(args[0])) {
        return;
      }
      _originalConsoleError.apply(console, args);
    };
    window.addEventListener('error', function (e) {
      if (/ResizeObserver loop/.test(e.message) || /ResizeObserver loop completed with undelivered notifications/.test(e.message)) {
        e.stopImmediatePropagation();
      }
    });
  </script>

  <!-- Dependencies for CoScript New UI -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#229bc3",
            "background-light": "#fafcff",
            "background-dark": "#16181d",
            "surface-dark": "#1e2127",
            "border-dark": "#2d323b",
          },
          fontFamily: {
            "display": ["Space Grotesk"],
            "mono": ["JetBrains Mono"]
          },
          borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        },
      },
    }
  </script>
  <style>
    .editor-bg {
      background-color: #1a1c22;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .cursor-tag {
      animation: pulse-border 2s infinite;
    }

    @keyframes pulse-border {
      0% {
        box-shadow: 0 0 0 0px rgba(34, 155, 195, 0.4);
      }

      70% {
        box-shadow: 0 0 0 6px rgba(34, 155, 195, 0);
      }

      100% {
        box-shadow: 0 0 0 0px rgba(34, 155, 195, 0);
      }
    }
  </style>

  <title>CoScript - Real-time Collaborative Code Editor</title>
